name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python sources
        run: python -m compileall -q dms_verein
      - name: Run import parser tests
        run: python -m unittest dms_verein.tests.test_member_import

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dms_verein/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dms_verein/frontend/package-lock.json
      - run: npm ci
      - run: npm run build