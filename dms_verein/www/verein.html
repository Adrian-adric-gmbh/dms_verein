<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  {% if is_produkt_page %}
  <title>DMS Verein – Die digitale Vereinsplattform</title>
  <meta name="description" content="{{ og_description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sascha Böhm Software &amp; App" />
  <meta property="og:title" content="{{ og_title }}" />
  <meta property="og:description" content="{{ og_description }}" />
  <meta property="og:image" content="{{ og_image }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:url" content="{{ og_url }}" />
  <meta property="og:locale" content="de_DE" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ og_title }}" />
  <meta name="twitter:description" content="{{ og_description }}" />
  <meta name="twitter:image" content="{{ og_image }}" />
  {% else %}
  <meta name="description" content="Vereinsverwaltung — Mitgliederportal" />
  {% endif %}

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#6366f1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="{{ vereinsname }}" />
  <meta name="msapplication-TileColor" content="#6366f1" />

  {% if not is_produkt_page %}<title>{{ vereinsname }}</title>{% endif %}

  <!-- PWA Manifest -->
  <link rel="manifest" href="/verein-manifest.json" />

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/verein-icon-192.svg" />
  <link rel="icon" type="image/svg+xml" href="/verein-icon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Frappe-eigene Elemente verstecken */
    .navbar, .page-head, nav.navbar, footer.web-footer,
    .web-footer, #navbar, .container > .page-header { display: none !important; }
    /* Reset – Body scrollt ganz normal */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #f8fafc; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>

  <script type="module" crossorigin src="/assets/dms_verein/frontend/assets/index.js"></script>
  <link rel="stylesheet" href="/assets/dms_verein/frontend/assets/index.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    window.csrf_token = "{{ frappe.session.csrf_token }}";
    window.frappe_session_user = "{{ frappe.session.user }}";
    window.frappe_user_roles = {{ rollen_json }};
    window.frappe = window.frappe || {};
    window.frappe.csrf_token = window.csrf_token;

    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/verein-sw.js', {
          scope: '/',
          updateViaCache: 'none'   // SW-Datei nie aus HTTP-Cache laden
        }).then(reg => {
          // Alle 60 Sek. aktiv auf Updates prüfen (wichtig für installierte PWA)
          setInterval(() => reg.update(), 60000);
        }).catch(() => {});

        // Wenn neuer SW die Kontrolle übernimmt → Seite neu laden
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
